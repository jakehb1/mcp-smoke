[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-smoke"
version = "0.1.0"
description = "Smoke-test any stdio MCP server in one command. Stdlib only."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jakeh Bradley"}]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://a-l.studio"

[project.scripts]
mcp-smoke = "mcpsmoke.cli:main"

[tool.setuptools]
packages = ["mcpsmoke"]
